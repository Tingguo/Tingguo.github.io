<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@600;900&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/mark.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>

<header class="masthead">
  <div class="wrap masthead-in">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="wordmark-name">{{ site.title }}</span>
      <span class="wordmark-sub">{{ site.tagline }}</span>
    </a>
    <nav class="nav">
      {%- for c in site.categories_meta %}
      <a class="nav-link{% if page.cat == c.key %} is-current{% endif %}" href="{{ c.url | relative_url }}">{{ c.name }}</a>
      {%- endfor %}
    </nav>
  </div>
</header>

<main id="main">
{{ content }}
</main>

<footer class="footer">
  <div class="wrap footer-in">
    <span>{{ site.title }} — {{ site.tagline }}</span>
    <span>共 {{ site.posts.size }} 条记录 · <a href="https://github.com/Tingguo/Tingguo.github.io">源码</a></span>
  </div>
</footer>
</body>
</html>
